<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 1650 870" width="1650" height="870">
<title id="title">图 7｜OpsAgent 与 AgentOps：基础设施层和 Agent 可靠性层</title>
<desc id="desc">OpsAgent 处理 IT 事件；AgentOps 把执行该任务的 Agent/harness 本身当作诊断对象。两者结合是有待评估的研究假设。</desc>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L10,5 L0,10 z" fill="#55748D"/>
  </marker>
  <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L10,5 L0,10 z" fill="#B42318"/>
  </marker>
  <marker id="arrow-teal" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L10,5 L0,10 z" fill="#0F766E"/>
  </marker>
  <style>
    text { font-family: "Noto Sans CJK SC", "Microsoft YaHei", "SimHei", sans-serif; fill: #183247; }
    .small { font-size: 15px; fill: #52677A; }
    .label { font-size: 16px; fill: #52677A; }
    .title { font-size: 21px; font-weight: 700; }
    .node-title { font-size: 19px; font-weight: 700; }
    .body { font-size: 16px; }
    .panel-title { font-size: 23px; font-weight: 700; }
  </style>
</defs>
<rect width="1650" height="870" rx="18" fill="#FBFCFE"/>
<text x="32" y="40" class="title">图 7｜OpsAgent 与 AgentOps：基础设施层和 Agent 可靠性层</text>
<text x="32" y="67" class="small">OpsAgent 处理 IT 事件；AgentOps 把执行该任务的 Agent/harness 本身当作诊断对象。两者结合是有待评估的研究假设。</text>
<rect x="45" y="105" width="700" height="660" rx="18" fill="#F4F9FC" stroke="#C7D3DD" stroke-width="1.5"/><text x="65" y="139" class="panel-title">IT / OpsAgent 层：系统发生什么故障？</text><rect x="905" y="105" width="700" height="660" rx="18" fill="#F6F8FB" stroke="#C7D3DD" stroke-width="1.5"/><text x="925" y="139" class="panel-title">AgentOps 层：Agent 为什么这样执行？</text><rect x="95" y="200" width="240" height="95" rx="14" fill="#DDF3EE" stroke="#0F766E" stroke-width="2"/><text x="215.0" y="230" text-anchor="middle" class="node-title">Incident</text><text x="215.0" y="254" text-anchor="middle" class="body"><tspan x="215.0" dy="0">服务 / 网络 / 系统告警</tspan></text><rect x="415" y="190" width="275" height="110" rx="14" fill="#DCEBFA" stroke="#274C6B" stroke-width="2"/><text x="552.5" y="220" text-anchor="middle" class="node-title">Telemetry + Candidate</text><text x="552.5" y="244" text-anchor="middle" class="body"><tspan x="552.5" dy="0">Metrics / Logs / Traces</tspan><tspan x="552.5" dy="21">拓扑 / 配置 / 工单</tspan></text><rect x="290" y="380" width="280" height="105" rx="14" fill="#FFF0D5" stroke="#9A6700" stroke-width="2"/><text x="430.0" y="410" text-anchor="middle" class="node-title">OpsAgent 调查</text><text x="430.0" y="434" text-anchor="middle" class="body"><tspan x="430.0" dy="0">选择工具与候选</tspan><tspan x="430.0" dy="21">形成证据化诊断</tspan></text><rect x="105" y="565" width="250" height="100" rx="14" fill="#F1F4F7" stroke="#274C6B" stroke-width="2"/><text x="230.0" y="595" text-anchor="middle" class="node-title">治理动作</text><text x="230.0" y="619" text-anchor="middle" class="body"><tspan x="230.0" dy="0">只读 / 人工批准</tspan><tspan x="230.0" dy="21">或有界修复</tspan></text><rect x="450" y="565" width="245" height="100" rx="14" fill="#DDF3EE" stroke="#0F766E" stroke-width="2"/><text x="572.5" y="595" text-anchor="middle" class="node-title">服务状态验证</text><text x="572.5" y="619" text-anchor="middle" class="body"><tspan x="572.5" dy="0">新观测 / 恢复信号</tspan><tspan x="572.5" dy="21">回滚 / 升级</tspan></text><rect x="950" y="195" width="250" height="100" rx="14" fill="#DCEBFA" stroke="#274C6B" stroke-width="2"/><text x="1075.0" y="225" text-anchor="middle" class="node-title">Agent Trajectory</text><text x="1075.0" y="249" text-anchor="middle" class="body"><tspan x="1075.0" dy="0">身份、输入、工具</tspan><tspan x="1075.0" dy="21">Observation、状态、依赖</tspan></text><rect x="1270" y="195" width="270" height="100" rx="14" fill="#FFF0D5" stroke="#9A6700" stroke-width="2"/><text x="1405.0" y="225" text-anchor="middle" class="node-title">AgentOps 诊断</text><text x="1405.0" y="249" text-anchor="middle" class="body"><tspan x="1405.0" dy="0">检测 → 归因 → 解释</tspan><tspan x="1405.0" dy="21">定位 Agent / Step</tspan></text><rect x="1270" y="385" width="270" height="100" rx="14" fill="#F1F4F7" stroke="#274C6B" stroke-width="2"/><text x="1405.0" y="415" text-anchor="middle" class="node-title">可靠性响应</text><text x="1405.0" y="439" text-anchor="middle" class="body"><tspan x="1405.0" dy="0">限制重试、修工具</tspan><tspan x="1405.0" dy="21">回滚 / 交给人</tspan></text><rect x="950" y="570" width="250" height="95" rx="14" fill="#DDF3EE" stroke="#0F766E" stroke-width="2"/><text x="1075.0" y="600" text-anchor="middle" class="node-title">独立结果检查</text><text x="1075.0" y="624" text-anchor="middle" class="body"><tspan x="1075.0" dy="0">Agent 行为与环境状态</tspan><tspan x="1075.0" dy="21">分开验证</tspan></text><rect x="120" y="705" width="1370" height="42" rx="14" fill="#FFF0D5" stroke="#9A6700" stroke-width="2"/><text x="805.0" y="735" text-anchor="middle" class="node-title" font-size="18px">研究假设：把 AgentOps 的轨迹归因与独立检查接入 OpsAgent，再用对照实验评估可靠性、成本和恢复率。</text><text x="805.0" y="759" text-anchor="middle" class="body"><tspan x="805.0" dy="0">尚未由现有论文联合验证</tspan></text><line x1="335" y1="247" x2="415" y2="247" stroke="#55748D" stroke-width="2.5" marker-end="url(#arrow)"/><line x1="550" y1="300" x2="430" y2="380" stroke="#55748D" stroke-width="2.5" marker-end="url(#arrow)"/><line x1="430" y1="485" x2="230" y2="565" stroke="#55748D" stroke-width="2.5" marker-end="url(#arrow)"/><line x1="430" y1="485" x2="570" y2="565" stroke="#55748D" stroke-width="2.5" marker-end="url(#arrow)"/><line x1="1200" y1="245" x2="1270" y2="245" stroke="#55748D" stroke-width="2.5" marker-end="url(#arrow)"/><line x1="1405" y1="295" x2="1405" y2="385" stroke="#55748D" stroke-width="2.5" marker-end="url(#arrow)"/><line x1="1270" y1="435" x2="1200" y2="610" stroke="#55748D" stroke-width="2.5" marker-end="url(#arrow)"/><polyline points="1200,620 850,620 850,450 570,450" fill="none" stroke="#0F766E" stroke-width="2.3" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="8 7" marker-end="url(#arrow-teal)"/><polyline points="570,615 570,335 535,300" fill="none" stroke="#0F766E" stroke-width="2.0" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="8 7" marker-end="url(#arrow-teal)"/><text x="760" y="350" text-anchor="middle" font-size="15px" fill="#52677A">Agent 内部动作与运维证据
需要按 ID / 时间 / 依赖关联</text></svg>
