<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 1600 790" width="1600" height="790">
<title id="title">图 3｜四种决策与规划架构</title>
<desc id="desc">从每轮反应，到先计划后执行，再到显式维护状态并按反馈重规划；复杂度和灵活性同时上升。</desc>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L10,5 L0,10 z" fill="#55748D"/>
  </marker>
  <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L10,5 L0,10 z" fill="#B42318"/>
  </marker>
  <marker id="arrow-teal" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L10,5 L0,10 z" fill="#0F766E"/>
  </marker>
  <style>
    text { font-family: "Noto Sans CJK SC", "Microsoft YaHei", "SimHei", sans-serif; fill: #183247; }
    .small { font-size: 15px; fill: #52677A; }
    .label { font-size: 16px; fill: #52677A; }
    .title { font-size: 21px; font-weight: 700; }
    .node-title { font-size: 19px; font-weight: 700; }
    .body { font-size: 16px; }
    .panel-title { font-size: 23px; font-weight: 700; }
  </style>
</defs>
<rect width="1600" height="790" rx="18" fill="#FBFCFE"/>
<text x="32" y="40" class="title">图 3｜四种决策与规划架构</text>
<text x="32" y="67" class="small">从每轮反应，到先计划后执行，再到显式维护状态并按反馈重规划；复杂度和灵活性同时上升。</text>
<rect x="35" y="100" width="365" height="610" rx="18" fill="#F5F9FD" stroke="#C7D3DD" stroke-width="1.5"/><text x="55" y="134" class="panel-title">Reactive Agent</text><rect x="425" y="100" width="365" height="610" rx="18" fill="#FBF8F1" stroke="#C7D3DD" stroke-width="1.5"/><text x="445" y="134" class="panel-title">Plan-first Agent</text><rect x="815" y="100" width="365" height="610" rx="18" fill="#F1F8F6" stroke="#C7D3DD" stroke-width="1.5"/><text x="835" y="134" class="panel-title">Planner–Executor</text><rect x="1205" y="100" width="360" height="610" rx="18" fill="#F7F5FB" stroke="#C7D3DD" stroke-width="1.5"/><text x="1225" y="134" class="panel-title">State-aware Agent</text><rect x="75" y="190" width="285" height="78" rx="14" fill="#DCEBFA" stroke="#274C6B" stroke-width="2"/><text x="217.5" y="220" text-anchor="middle" class="node-title">当前 Observation</text><text x="217.5" y="244" text-anchor="middle" class="body"><tspan x="217.5" dy="0">新证据 / 任务状态</tspan></text><rect x="75" y="325" width="285" height="85" rx="14" fill="#DDF3EE" stroke="#0F766E" stroke-width="2"/><text x="217.5" y="355" text-anchor="middle" class="node-title">LLM 选下一步</text><text x="217.5" y="379" text-anchor="middle" class="body"><tspan x="217.5" dy="0">每轮根据最近结果</tspan><tspan x="217.5" dy="21">选择一个 Action</tspan></text><rect x="75" y="490" width="285" height="78" rx="14" fill="#F1F4F7" stroke="#274C6B" stroke-width="2"/><text x="217.5" y="520" text-anchor="middle" class="node-title">Tool 执行</text><text x="217.5" y="544" text-anchor="middle" class="body"><tspan x="217.5" dy="0">返回 Observation</tspan></text><line x1="218" y1="268" x2="218" y2="325" stroke="#55748D" stroke-width="2.5" marker-end="url(#arrow)"/><line x1="218" y1="410" x2="218" y2="490" stroke="#55748D" stroke-width="2.5" marker-end="url(#arrow)"/><polyline points="218,568 218,620 50,620 50,230 75,230" fill="none" stroke="#0F766E" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-teal)"/><text x="218" y="675" text-anchor="middle" font-size="14px" fill="#52677A">ReAct：动作与观察交错</text><rect x="465" y="190" width="285" height="75" rx="14" fill="#DDF3EE" stroke="#0F766E" stroke-width="2"/><text x="607.5" y="220" text-anchor="middle" class="node-title">目标</text><text x="607.5" y="244" text-anchor="middle" class="body"><tspan x="607.5" dy="0">先生成步骤草案</tspan></text><rect x="465" y="315" width="285" height="94" rx="14" fill="#FFF0D5" stroke="#9A6700" stroke-width="2"/><text x="607.5" y="345" text-anchor="middle" class="node-title">完整计划</text><text x="607.5" y="369" text-anchor="middle" class="body"><tspan x="607.5" dy="0">后续要查什么预先写出</tspan><tspan x="607.5" dy="21">工具结果尚未返回</tspan></text><rect x="465" y="485" width="285" height="80" rx="14" fill="#F1F4F7" stroke="#274C6B" stroke-width="2"/><text x="607.5" y="515" text-anchor="middle" class="node-title">依次执行</text><text x="607.5" y="539" text-anchor="middle" class="body"><tspan x="607.5" dy="0">中间结果不自动改写计划</tspan></text><line x1="608" y1="265" x2="608" y2="315" stroke="#55748D" stroke-width="2.5" marker-end="url(#arrow)"/><line x1="608" y1="409" x2="608" y2="485" stroke="#55748D" stroke-width="2.5" marker-end="url(#arrow)"/><text x="608" y="675" text-anchor="middle" font-size="14px" fill="#52677A">ReWOO：Plan → Work → Solve</text><rect x="855" y="190" width="285" height="75" rx="14" fill="#DDF3EE" stroke="#0F766E" stroke-width="2"/><text x="997.5" y="220" text-anchor="middle" class="node-title">Planner</text><text x="997.5" y="244" text-anchor="middle" class="body"><tspan x="997.5" dy="0">生成受约束计划</tspan></text><rect x="855" y="315" width="285" height="80" rx="14" fill="#DCEBFA" stroke="#274C6B" stroke-width="2"/><text x="997.5" y="345" text-anchor="middle" class="node-title">结构化计划</text><text x="997.5" y="369" text-anchor="middle" class="body"><tspan x="997.5" dy="0">步骤 / 前置条件 / 目标</tspan></text><rect x="855" y="455" width="285" height="82" rx="14" fill="#F1F4F7" stroke="#274C6B" stroke-width="2"/><text x="997.5" y="485" text-anchor="middle" class="node-title">Executor + Tool</text><text x="997.5" y="509" text-anchor="middle" class="body"><tspan x="997.5" dy="0">执行计划、返回状态</tspan></text><rect x="855" y="585" width="285" height="70" rx="14" fill="#FFF0D5" stroke="#9A6700" stroke-width="2"/><text x="997.5" y="615" text-anchor="middle" class="node-title">Solver / 检查</text><text x="997.5" y="639" text-anchor="middle" class="body"><tspan x="997.5" dy="0">解读结果或报告失败</tspan></text><line x1="998" y1="265" x2="998" y2="315" stroke="#55748D" stroke-width="2.5" marker-end="url(#arrow)"/><line x1="998" y1="395" x2="998" y2="455" stroke="#55748D" stroke-width="2.5" marker-end="url(#arrow)"/><line x1="998" y1="537" x2="998" y2="585" stroke="#55748D" stroke-width="2.5" marker-end="url(#arrow)"/><text x="998" y="675" text-anchor="middle" font-size="14px" fill="#52677A">LLM+P：LLM → PDDL → classical planner</text><rect x="1240" y="185" width="285" height="80" rx="14" fill="#DCEBFA" stroke="#274C6B" stroke-width="2"/><text x="1382.5" y="215" text-anchor="middle" class="node-title">Task + Belief + 执行进度</text><text x="1382.5" y="239" text-anchor="middle" class="body"><tspan x="1382.5" dy="0">显式记录当前状态</tspan></text><rect x="1240" y="315" width="285" height="80" rx="14" fill="#DDF3EE" stroke="#0F766E" stroke-width="2"/><text x="1382.5" y="345" text-anchor="middle" class="node-title">选择 / 规划下一步</text><text x="1382.5" y="369" text-anchor="middle" class="body"><tspan x="1382.5" dy="0">针对当前 gap 决策</tspan></text><rect x="1240" y="455" width="285" height="82" rx="14" fill="#F1F4F7" stroke="#274C6B" stroke-width="2"/><text x="1382.5" y="485" text-anchor="middle" class="node-title">执行并取得 Observation</text><text x="1382.5" y="509" text-anchor="middle" class="body"><tspan x="1382.5" dy="0">比较预期与实际</tspan></text><rect x="1240" y="585" width="285" height="70" rx="14" fill="#FFF0D5" stroke="#9A6700" stroke-width="2"/><text x="1382.5" y="615" text-anchor="middle" class="node-title">验证 / 重规划 / 停止</text><text x="1382.5" y="639" text-anchor="middle" class="body"><tspan x="1382.5" dy="0">达到条件才结束</tspan></text><line x1="1382" y1="265" x2="1382" y2="315" stroke="#55748D" stroke-width="2.5" marker-end="url(#arrow)"/><line x1="1382" y1="395" x2="1382" y2="455" stroke="#55748D" stroke-width="2.5" marker-end="url(#arrow)"/><line x1="1382" y1="537" x2="1382" y2="585" stroke="#55748D" stroke-width="2.5" marker-end="url(#arrow)"/><polyline points="1240,620 1220,620 1220,225 1240,225" fill="none" stroke="#0F766E" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-teal)"/><text x="1382" y="675" text-anchor="middle" font-size="14px" fill="#52677A">PoS：显式 belief / gap / 停滞</text></svg>
