<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 1500 790" width="1500" height="790">
<title id="title">图 2｜六种 State 的信息关系</title>
<desc id="desc">World State 是外部现实；Belief 是有证据的暂时判断；Context 是从任务、信念、执行状态和检索记忆投影给模型的视图。</desc>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L10,5 L0,10 z" fill="#55748D"/>
  </marker>
  <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L10,5 L0,10 z" fill="#B42318"/>
  </marker>
  <marker id="arrow-teal" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L10,5 L0,10 z" fill="#0F766E"/>
  </marker>
  <style>
    text { font-family: "Noto Sans CJK SC", "Microsoft YaHei", "SimHei", sans-serif; fill: #183247; }
    .small { font-size: 15px; fill: #52677A; }
    .label { font-size: 16px; fill: #52677A; }
    .title { font-size: 21px; font-weight: 700; }
    .node-title { font-size: 19px; font-weight: 700; }
    .body { font-size: 16px; }
    .panel-title { font-size: 23px; font-weight: 700; }
  </style>
</defs>
<rect width="1500" height="790" rx="18" fill="#FBFCFE"/>
<text x="32" y="40" class="title">图 2｜六种 State 的信息关系</text>
<text x="32" y="67" class="small">World State 是外部现实；Belief 是有证据的暂时判断；Context 是从任务、信念、执行状态和检索记忆投影给模型的视图。</text>
<rect x="60" y="110" width="255" height="100" rx="14" fill="#DDF3EE" stroke="#0F766E" stroke-width="2"/><text x="187.5" y="140" text-anchor="middle" class="node-title">Task State</text><text x="187.5" y="164" text-anchor="middle" class="body"><tspan x="187.5" dy="0">目标、约束、完成条件</tspan><tspan x="187.5" dy="21">当前未完成子目标</tspan></text><rect x="60" y="325" width="255" height="105" rx="14" fill="#F1F4F7" stroke="#274C6B" stroke-width="2"/><text x="187.5" y="355" text-anchor="middle" class="node-title">Memory</text><text x="187.5" y="379" text-anchor="middle" class="body"><tspan x="187.5" dy="0">跨回合保存的经验</tspan><tspan x="187.5" dy="21">检索后仍需检查适用性</tspan></text><rect x="430" y="210" width="285" height="125" rx="14" fill="#FFF0D5" stroke="#9A6700" stroke-width="2"/><text x="572.5" y="240" text-anchor="middle" class="node-title">Belief State</text><text x="572.5" y="264" text-anchor="middle" class="body"><tspan x="572.5" dy="0">当前假设 + 支持 / 反证</tspan><tspan x="572.5" dy="21">来源、时间、不确定性</tspan></text><rect x="795" y="110" width="250" height="95" rx="14" fill="#DCEBFA" stroke="#274C6B" stroke-width="2"/><text x="920.0" y="140" text-anchor="middle" class="node-title">World State</text><text x="920.0" y="164" text-anchor="middle" class="body"><tspan x="920.0" dy="0">外部系统真实情况</tspan><tspan x="920.0" dy="21">Agent 通常看不全</tspan></text><rect x="790" y="270" width="255" height="100" rx="14" fill="#DDF3EE" stroke="#0F766E" stroke-width="2"/><text x="917.5" y="300" text-anchor="middle" class="node-title">Observation</text><text x="917.5" y="324" text-anchor="middle" class="body"><tspan x="917.5" dy="0">工具返回的证据</tspan><tspan x="917.5" dy="21">带实体、时间与来源</tspan></text><rect x="1125" y="270" width="300" height="100" rx="14" fill="#F1F4F7" stroke="#274C6B" stroke-width="2"/><text x="1275.0" y="300" text-anchor="middle" class="node-title">Evidence Provenance</text><text x="1275.0" y="324" text-anchor="middle" class="body"><tspan x="1275.0" dy="0">谁 / 何时 / 如何查询</tspan><tspan x="1275.0" dy="21">可复查、可识别冲突</tspan></text><rect x="455" y="485" width="365" height="120" rx="14" fill="#DCEBFA" stroke="#274C6B" stroke-width="2"/><text x="637.5" y="515" text-anchor="middle" class="node-title">Context</text><text x="637.5" y="539" text-anchor="middle" class="body"><tspan x="637.5" dy="0">本轮模型可见的有限视图</tspan><tspan x="637.5" dy="21">由 Task + Belief + 执行状态</tspan><tspan x="637.5" dy="21">+ 按需检索的 Memory 组成</tspan></text><rect x="1015" y="485" width="360" height="120" rx="14" fill="#F1F4F7" stroke="#274C6B" stroke-width="2"/><text x="1195.0" y="515" text-anchor="middle" class="node-title">Execution State</text><text x="1195.0" y="539" text-anchor="middle" class="body"><tspan x="1195.0" dy="0">Runtime 确认执行到哪里</tspan><tspan x="1195.0" dy="21">调用、超时、拒绝、handoff</tspan><tspan x="1195.0" dy="21">预算与 checkpoint</tspan></text><rect x="565" y="670" width="250" height="78" rx="14" fill="#DCEBFA" stroke="#274C6B" stroke-width="2"/><text x="690.0" y="700" text-anchor="middle" class="node-title">LLM 提议</text><text x="690.0" y="724" text-anchor="middle" class="body"><tspan x="690.0" dy="0">下一步 / 假设 / 结束</tspan></text><line x1="315" y1="160" x2="455" y2="485" stroke="#55748D" stroke-width="2.5" marker-end="url(#arrow)"/><line x1="315" y1="375" x2="455" y2="485" stroke="#55748D" stroke-width="2.5" marker-end="url(#arrow)"/><line x1="715" y1="275" x2="790" y2="315" stroke="#0F766E" stroke-width="2.5" marker-end="url(#arrow-teal)"/><line x1="1045" y1="157" x2="915" y2="270" stroke="#55748D" stroke-width="2.5" marker-end="url(#arrow)"/><line x1="1045" y1="320" x2="1125" y2="320" stroke="#55748D" stroke-width="2.5" marker-end="url(#arrow)"/><line x1="1125" y1="320" x2="715" y2="260" stroke="#0F766E" stroke-width="2.5" marker-end="url(#arrow-teal)"/><line x1="820" y1="545" x2="1015" y2="545" stroke="#55748D" stroke-width="2.5" marker-end="url(#arrow)"/><line x1="820" y1="545" x2="690" y2="670" stroke="#55748D" stroke-width="2.5" marker-end="url(#arrow)"/><polyline points="690,670 690,640 1190,640 1190,605" fill="none" stroke="#55748D" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><polyline points="1190,485 1190,430 585,430 585,335" fill="none" stroke="#9A6700" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="7 6" marker-end="url(#arrow)"/><polyline points="1015,570 355,570 355,205" fill="none" stroke="#55748D" stroke-width="2.0" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="7 6" marker-end="url(#arrow)"/><text x="1120" y="145" text-anchor="middle" font-size="15px" fill="#52677A">外部查询 / 监控</text><text x="880" y="240" text-anchor="middle" font-size="15px" fill="#52677A">查询结果</text><text x="1110" y="420" text-anchor="middle" font-size="14px" fill="#52677A">仅经运行时确认的执行事实进入状态</text><text x="610" y="453" text-anchor="middle" font-size="14px" fill="#52677A">模型看到的是视图，不是完整现实</text></svg>
