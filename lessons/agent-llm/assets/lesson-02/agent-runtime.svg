<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 1660 760" width="1660" height="760">
<title id="title">图 1｜Agent Runtime 主循环</title>
<desc id="desc">LLM 提出决策；Runtime 校验并执行；Observation 更新状态。Final、handoff 与 tool 是不同分支。</desc>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L10,5 L0,10 z" fill="#55748D"/>
  </marker>
  <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L10,5 L0,10 z" fill="#B42318"/>
  </marker>
  <marker id="arrow-teal" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L10,5 L0,10 z" fill="#0F766E"/>
  </marker>
  <style>
    text { font-family: "Noto Sans CJK SC", "Microsoft YaHei", "SimHei", sans-serif; fill: #183247; }
    .small { font-size: 15px; fill: #52677A; }
    .label { font-size: 16px; fill: #52677A; }
    .title { font-size: 21px; font-weight: 700; }
    .node-title { font-size: 19px; font-weight: 700; }
    .body { font-size: 16px; }
    .panel-title { font-size: 23px; font-weight: 700; }
  </style>
</defs>
<rect width="1660" height="760" rx="18" fill="#FBFCFE"/>
<text x="32" y="40" class="title">图 1｜Agent Runtime 主循环</text>
<text x="32" y="67" class="small">LLM 提出决策；Runtime 校验并执行；Observation 更新状态。Final、handoff 与 tool 是不同分支。</text>
<rect x="35" y="125" width="190" height="104" rx="14" fill="#DDF3EE" stroke="#0F766E" stroke-width="2"/><text x="130.0" y="155" text-anchor="middle" class="node-title">Task + 约束</text><text x="130.0" y="179" text-anchor="middle" class="body"><tspan x="130.0" dy="0">目标、范围、权限</tspan><tspan x="130.0" dy="21">完成条件、预算</tspan></text><rect x="270" y="125" width="190" height="104" rx="14" fill="#DCEBFA" stroke="#274C6B" stroke-width="2"/><text x="365.0" y="155" text-anchor="middle" class="node-title">State</text><text x="365.0" y="179" text-anchor="middle" class="body"><tspan x="365.0" dy="0">任务进度、证据</tspan><tspan x="365.0" dy="21">工具结果、待办</tspan></text><rect x="505" y="125" width="200" height="104" rx="14" fill="#DCEBFA" stroke="#274C6B" stroke-width="2"/><text x="605.0" y="155" text-anchor="middle" class="node-title">LLM 决策</text><text x="605.0" y="179" text-anchor="middle" class="body"><tspan x="605.0" dy="0">提出回答 / handoff</tspan><tspan x="605.0" dy="21">或工具调用</tspan></text><rect x="750" y="125" width="200" height="104" rx="14" fill="#F1F4F7" stroke="#274C6B" stroke-width="2"/><text x="850.0" y="155" text-anchor="middle" class="node-title">Runtime 解析</text><text x="850.0" y="179" text-anchor="middle" class="body"><tspan x="850.0" dy="0">检查输出结构</tspan><tspan x="850.0" dy="21">转成受控决策</tspan></text><polygon points="1080,111 1180,177 1080,243 980,177" fill="#FFF0D5" stroke="#9A6700" stroke-width="2"/><text x="1080" y="182" text-anchor="middle" class="node-title">分支</text><rect x="1260" y="30" width="340" height="94" rx="14" fill="#DDF3EE" stroke="#0F766E" stroke-width="2"/><text x="1430.0" y="60" text-anchor="middle" class="node-title">Final → 独立核验</text><text x="1430.0" y="84" text-anchor="middle" class="body"><tspan x="1430.0" dy="0">通过则结束；不足则继续或升级</tspan></text><rect x="1260" y="210" width="340" height="94" rx="14" fill="#F1F4F7" stroke="#274C6B" stroke-width="2"/><text x="1430.0" y="240" text-anchor="middle" class="node-title">Handoff → 交接状态</text><text x="1430.0" y="264" text-anchor="middle" class="body"><tspan x="1430.0" dy="0">目标、证据、责任人、等待状态</tspan></text><rect x="1010" y="385" width="250" height="110" rx="14" fill="#FFF0D5" stroke="#9A6700" stroke-width="2"/><text x="1135.0" y="415" text-anchor="middle" class="node-title">权限 / Schema / 预算</text><text x="1135.0" y="439" text-anchor="middle" class="body"><tspan x="1135.0" dy="0">由 Runtime 强制检查</tspan><tspan x="1135.0" dy="21">拒绝不合规动作</tspan></text><rect x="710" y="585" width="250" height="92" rx="14" fill="#FCE4E4" stroke="#B42318" stroke-width="2"/><text x="835.0" y="615" text-anchor="middle" class="node-title">拒绝并记原因</text><text x="835.0" y="639" text-anchor="middle" class="body"><tspan x="835.0" dy="0">修正参数、换工具</tspan><tspan x="835.0" dy="21">或停止 / 升级</tspan></text><rect x="1020" y="585" width="250" height="92" rx="14" fill="#DCEBFA" stroke="#274C6B" stroke-width="2"/><text x="1145.0" y="615" text-anchor="middle" class="node-title">执行获准 Tool</text><text x="1145.0" y="639" text-anchor="middle" class="body"><tspan x="1145.0" dy="0">实际调用外部接口</tspan></text><rect x="1330" y="585" width="280" height="92" rx="14" fill="#DDF3EE" stroke="#0F766E" stroke-width="2"/><text x="1470.0" y="615" text-anchor="middle" class="node-title">Observation + 更新</text><text x="1470.0" y="639" text-anchor="middle" class="body"><tspan x="1470.0" dy="0">结果、来源、实体、时间</tspan><tspan x="1470.0" dy="21">写回 State 并记录轨迹</tspan></text><line x1="225" y1="177" x2="270" y2="177" stroke="#55748D" stroke-width="2.5" marker-end="url(#arrow)"/><line x1="460" y1="177" x2="505" y2="177" stroke="#55748D" stroke-width="2.5" marker-end="url(#arrow)"/><line x1="705" y1="177" x2="750" y2="177" stroke="#55748D" stroke-width="2.5" marker-end="url(#arrow)"/><line x1="950" y1="177" x2="980" y2="177" stroke="#55748D" stroke-width="2.5" marker-end="url(#arrow)"/><polyline points="1180,150 1215,150 1215,77 1260,77" fill="none" stroke="#55748D" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><polyline points="1180,177 1220,177 1220,257 1260,257" fill="none" stroke="#55748D" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><polyline points="1080,243 1080,330 1135,330 1135,385" fill="none" stroke="#55748D" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><polyline points="1010,440 900,440 900,585" fill="none" stroke="#55748D" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><polyline points="1135,495 1135,585" fill="none" stroke="#55748D" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="1270" y1="631" x2="1330" y2="631" stroke="#0F766E" stroke-width="2.5" marker-end="url(#arrow-teal)"/><polyline points="1470,585 1470,525 370,525 370,229" fill="none" stroke="#0F766E" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-teal)"/><polyline points="835,677 835,710 370,710 370,229" fill="none" stroke="#B42318" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="8 7" marker-end="url(#arrow-red)"/><text x="1223" y="130" text-anchor="middle" font-size="15px" fill="#52677A">final</text><text x="1220" y="222" text-anchor="middle" font-size="15px" fill="#52677A">handoff</text><text x="1095" y="312" text-anchor="middle" font-size="15px" fill="#52677A">tool</text><text x="820" y="555" text-anchor="middle" font-size="15px" fill="#52677A">rejected</text><text x="1500" y="550" text-anchor="middle" font-size="15px" fill="#52677A">result</text><text x="830" y="737" text-anchor="middle" font-size="14px" fill="#52677A">拒绝事件也进入状态；是否继续由终止策略决定</text></svg>
