<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 1650 900" width="1650" height="900">
<title id="title">图 6｜错误传播与轨迹级责任归因</title>
<desc id="desc">上半部分是明确标注的教学故障；下半部分分别概括 AgentRx 与 TraJudger 的论文机制，不表示二者在同一系统中组合运行。</desc>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L10,5 L0,10 z" fill="#55748D"/>
  </marker>
  <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L10,5 L0,10 z" fill="#B42318"/>
  </marker>
  <marker id="arrow-teal" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L10,5 L0,10 z" fill="#0F766E"/>
  </marker>
  <style>
    text { font-family: "Noto Sans CJK SC", "Microsoft YaHei", "SimHei", sans-serif; fill: #183247; }
    .small { font-size: 15px; fill: #52677A; }
    .label { font-size: 16px; fill: #52677A; }
    .title { font-size: 21px; font-weight: 700; }
    .node-title { font-size: 19px; font-weight: 700; }
    .body { font-size: 16px; }
    .panel-title { font-size: 23px; font-weight: 700; }
  </style>
</defs>
<rect width="1650" height="900" rx="18" fill="#FBFCFE"/>
<text x="32" y="40" class="title">图 6｜错误传播与轨迹级责任归因</text>
<text x="32" y="67" class="small">上半部分是明确标注的教学故障；下半部分分别概括 AgentRx 与 TraJudger 的论文机制，不表示二者在同一系统中组合运行。</text>
<text x="55" y="115" text-anchor="start" font-size="17px" fill="#B42318">基于论文机制的教学故障：目标是 checkout / 最近 30 分钟，但协调者错误派发 payment / 最近 24 小时查询</text><rect x="35" y="160" width="235" height="105" rx="14" fill="#FCE4E4" stroke="#B42318" stroke-width="2"/><text x="152.5" y="190" text-anchor="middle" class="node-title">根因步骤</text><text x="152.5" y="214" text-anchor="middle" class="body"><tspan x="152.5" dy="0">Coordinator 改错</tspan><tspan x="152.5" dy="21">实体与时间窗</tspan></text><rect x="310" y="160" width="235" height="105" rx="14" fill="#FFF0D5" stroke="#9A6700" stroke-width="2"/><text x="427.5" y="190" text-anchor="middle" class="node-title">Tool 调用</text><text x="427.5" y="214" text-anchor="middle" class="body"><tspan x="427.5" dy="0">Metric Agent 查错</tspan><tspan x="427.5" dy="21">结果对本查询有效</tspan></text><rect x="585" y="160" width="235" height="105" rx="14" fill="#FFF0D5" stroke="#9A6700" stroke-width="2"/><text x="702.5" y="190" text-anchor="middle" class="node-title">传播 conduit</text><text x="702.5" y="214" text-anchor="middle" class="body"><tspan x="702.5" dy="0">Coordinator 把结果</tspan><tspan x="702.5" dy="21">错误归属到 checkout</tspan></text><rect x="860" y="160" width="235" height="105" rx="14" fill="#FFF0D5" stroke="#9A6700" stroke-width="2"/><text x="977.5" y="190" text-anchor="middle" class="node-title">下游 RCA</text><text x="977.5" y="214" text-anchor="middle" class="body"><tspan x="977.5" dy="0">排除数据库</tspan><tspan x="977.5" dy="21">沿错误证据推断</tspan></text><rect x="1135" y="160" width="210" height="105" rx="14" fill="#FFF0D5" stroke="#9A6700" stroke-width="2"/><text x="1240.0" y="190" text-anchor="middle" class="node-title">Reviewer</text><text x="1240.0" y="214" text-anchor="middle" class="body"><tspan x="1240.0" dy="0">只看摘要</tspan><tspan x="1240.0" dy="21">未重查证据</tspan></text><rect x="1385" y="160" width="230" height="105" rx="14" fill="#FCE4E4" stroke="#B42318" stroke-width="2"/><text x="1500.0" y="190" text-anchor="middle" class="node-title">终端症状</text><text x="1500.0" y="214" text-anchor="middle" class="body"><tspan x="1500.0" dy="0">错误根因报告</tspan></text><line x1="270" y1="212" x2="310" y2="212" stroke="#B42318" stroke-width="2.5" marker-end="url(#arrow-red)"/><line x1="545" y1="212" x2="585" y2="212" stroke="#55748D" stroke-width="2.5" marker-end="url(#arrow)"/><line x1="820" y1="212" x2="860" y2="212" stroke="#55748D" stroke-width="2.5" marker-end="url(#arrow)"/><line x1="1095" y1="212" x2="1135" y2="212" stroke="#55748D" stroke-width="2.5" marker-end="url(#arrow)"/><line x1="1345" y1="212" x2="1385" y2="212" stroke="#B42318" stroke-width="2.5" marker-end="url(#arrow-red)"/><text x="50" y="315" text-anchor="start" font-size="16px" fill="#52677A">归因不能只看最后输出者：要沿任务、调用参数、Observation、状态写入和依赖边向前回溯。</text><rect x="40" y="370" width="755" height="385" rx="18" fill="#F4F8FC" stroke="#C7D3DD" stroke-width="1.5"/><text x="60" y="404" class="panel-title">AgentRx｜约束证据 → 首个不可恢复步骤</text><rect x="825" y="370" width="785" height="385" rx="18" fill="#F4F8FC" stroke="#C7D3DD" stroke-width="1.5"/><text x="845" y="404" class="panel-title">TraJudger｜HCG → 失败后的反向遍历</text><rect x="75" y="455" width="205" height="100" rx="14" fill="#DCEBFA" stroke="#274C6B" stroke-width="2"/><text x="177.5" y="485" text-anchor="middle" class="node-title">规范化轨迹 IR</text><text x="177.5" y="509" text-anchor="middle" class="body"><tspan x="177.5" dy="0">保留 step 与工具事件</tspan></text><rect x="325" y="455" width="205" height="100" rx="14" fill="#F1F4F7" stroke="#274C6B" stroke-width="2"/><text x="427.5" y="485" text-anchor="middle" class="node-title">静态 / 动态约束</text><text x="427.5" y="509" text-anchor="middle" class="body"><tspan x="427.5" dy="0">Schema、policy、预期</tspan></text><rect x="575" y="455" width="185" height="100" rx="14" fill="#DDF3EE" stroke="#0F766E" stroke-width="2"/><text x="667.5" y="485" text-anchor="middle" class="node-title">Checker 证据</text><text x="667.5" y="509" text-anchor="middle" class="body"><tspan x="667.5" dy="0">step + violation</tspan></text><rect x="325" y="610" width="235" height="88" rx="14" fill="#FFF0D5" stroke="#9A6700" stroke-width="2"/><text x="442.5" y="640" text-anchor="middle" class="node-title">Judge</text><text x="442.5" y="664" text-anchor="middle" class="body"><tspan x="442.5" dy="0">选择关键失败步 / 类型</tspan></text><rect x="860" y="455" width="205" height="100" rx="14" fill="#DCEBFA" stroke="#274C6B" stroke-width="2"/><text x="962.5" y="485" text-anchor="middle" class="node-title">HCG 节点与边</text><text x="962.5" y="509" text-anchor="middle" class="body"><tspan x="962.5" dy="0">意图 / 动作 / 依赖</tspan></text><rect x="1110" y="455" width="205" height="100" rx="14" fill="#F1F4F7" stroke="#274C6B" stroke-width="2"/><text x="1212.5" y="485" text-anchor="middle" class="node-title">专门诊断角色</text><text x="1212.5" y="509" text-anchor="middle" class="body"><tspan x="1212.5" dy="0">约束、逻辑、执行</tspan><tspan x="1212.5" dy="21">协作 / 上下文</tspan></text><rect x="1370" y="455" width="190" height="100" rx="14" fill="#DDF3EE" stroke="#0F766E" stroke-width="2"/><text x="1465.0" y="485" text-anchor="middle" class="node-title">反向图遍历</text><text x="1465.0" y="509" text-anchor="middle" class="body"><tspan x="1465.0" dy="0">root vs conduit</tspan></text><rect x="1115" y="610" width="300" height="88" rx="14" fill="#FFF0D5" stroke="#9A6700" stroke-width="2"/><text x="1265.0" y="640" text-anchor="middle" class="node-title">输出归因链</text><text x="1265.0" y="664" text-anchor="middle" class="body"><tspan x="1265.0" dy="0">root step / responsible agent</tspan><tspan x="1265.0" dy="21">propagation / symptom</tspan></text><line x1="280" y1="505" x2="325" y2="505" stroke="#55748D" stroke-width="2.5" marker-end="url(#arrow)"/><line x1="530" y1="505" x2="575" y2="505" stroke="#55748D" stroke-width="2.5" marker-end="url(#arrow)"/><polyline points="665,555 665,610 560,650" fill="none" stroke="#55748D" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="1065" y1="505" x2="1110" y2="505" stroke="#55748D" stroke-width="2.5" marker-end="url(#arrow)"/><line x1="1315" y1="505" x2="1370" y2="505" stroke="#55748D" stroke-width="2.5" marker-end="url(#arrow)"/><polyline points="1465,555 1465,650 1415,650" fill="none" stroke="#55748D" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><text x="55" y="780" text-anchor="start" font-size="16px" fill="#B42318">AgentRx 和 TraJudger 都是失败后的诊断方法：不代表在线检测器，也不执行或验证修复。</text></svg>
