<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 1600 820" width="1600" height="820">
<title id="title">图 4｜同一故障：Single Agent 与 Multi-Agent</title>
<desc id="desc">Single Agent 也可以调用多个工具；Multi-Agent 增加角色分工、handoff 与共享证据，也增加协调和传播故障。</desc>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L10,5 L0,10 z" fill="#55748D"/>
  </marker>
  <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L10,5 L0,10 z" fill="#B42318"/>
  </marker>
  <marker id="arrow-teal" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L10,5 L0,10 z" fill="#0F766E"/>
  </marker>
  <style>
    text { font-family: "Noto Sans CJK SC", "Microsoft YaHei", "SimHei", sans-serif; fill: #183247; }
    .small { font-size: 15px; fill: #52677A; }
    .label { font-size: 16px; fill: #52677A; }
    .title { font-size: 21px; font-weight: 700; }
    .node-title { font-size: 19px; font-weight: 700; }
    .body { font-size: 16px; }
    .panel-title { font-size: 23px; font-weight: 700; }
  </style>
</defs>
<rect width="1600" height="820" rx="18" fill="#FBFCFE"/>
<text x="32" y="40" class="title">图 4｜同一故障：Single Agent 与 Multi-Agent</text>
<text x="32" y="67" class="small">Single Agent 也可以调用多个工具；Multi-Agent 增加角色分工、handoff 与共享证据，也增加协调和传播故障。</text>
<rect x="35" y="100" width="725" height="650" rx="18" fill="#F5F9FD" stroke="#C7D3DD" stroke-width="1.5"/><text x="55" y="134" class="panel-title">Single Agent</text><rect x="805" y="100" width="760" height="650" rx="18" fill="#F1F8F6" stroke="#C7D3DD" stroke-width="1.5"/><text x="825" y="134" class="panel-title">Multi-Agent</text><rect x="85" y="190" width="250" height="105" rx="14" fill="#DCEBFA" stroke="#274C6B" stroke-width="2"/><text x="210.0" y="220" text-anchor="middle" class="node-title">一个 Agent</text><text x="210.0" y="244" text-anchor="middle" class="body"><tspan x="210.0" dy="0">持有任务状态</tspan><tspan x="210.0" dy="21">选择下一项查询</tspan></text><rect x="405" y="160" width="285" height="78" rx="14" fill="#F1F4F7" stroke="#274C6B" stroke-width="2"/><text x="547.5" y="190" text-anchor="middle" class="node-title">Metrics Tool</text><text x="547.5" y="214" text-anchor="middle" class="body"><tspan x="547.5" dy="0">P95 / CPU / pool</tspan></text><rect x="405" y="280" width="285" height="78" rx="14" fill="#F1F4F7" stroke="#274C6B" stroke-width="2"/><text x="547.5" y="310" text-anchor="middle" class="node-title">Logs Tool</text><text x="547.5" y="334" text-anchor="middle" class="body"><tspan x="547.5" dy="0">timeout / retry</tspan></text><rect x="405" y="400" width="285" height="78" rx="14" fill="#F1F4F7" stroke="#274C6B" stroke-width="2"/><text x="547.5" y="430" text-anchor="middle" class="node-title">Topology Tool</text><text x="547.5" y="454" text-anchor="middle" class="body"><tspan x="547.5" dy="0">service dependency</tspan></text><rect x="175" y="545" width="390" height="105" rx="14" fill="#DDF3EE" stroke="#0F766E" stroke-width="2"/><text x="370.0" y="575" text-anchor="middle" class="node-title">共享调查状态</text><text x="370.0" y="599" text-anchor="middle" class="body"><tspan x="370.0" dy="0">同一决策者汇总证据</tspan><tspan x="370.0" dy="21">检查候选并停止 / 升级</tspan></text><line x1="335" y1="235" x2="405" y2="199" stroke="#55748D" stroke-width="2.5" marker-end="url(#arrow)"/><line x1="335" y1="240" x2="405" y2="319" stroke="#55748D" stroke-width="2.5" marker-end="url(#arrow)"/><line x1="335" y1="245" x2="405" y2="439" stroke="#55748D" stroke-width="2.5" marker-end="url(#arrow)"/><polyline points="550,238 610,238 610,545 565,580" fill="none" stroke="#55748D" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><polyline points="550,358 585,358 585,545" fill="none" stroke="#55748D" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><polyline points="550,478 550,545" fill="none" stroke="#55748D" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><text x="395" y="690" text-anchor="middle" font-size="14px" fill="#52677A">上下文简单；单点推理和自检容易共享偏差</text><rect x="850" y="190" width="225" height="95" rx="14" fill="#DDF3EE" stroke="#0F766E" stroke-width="2"/><text x="962.5" y="220" text-anchor="middle" class="node-title">Coordinator</text><text x="962.5" y="244" text-anchor="middle" class="body"><tspan x="962.5" dy="0">拆任务 / 分派</tspan><tspan x="962.5" dy="21">收集 / 判断停止</tspan></text><rect x="1130" y="145" width="185" height="90" rx="14" fill="#DCEBFA" stroke="#274C6B" stroke-width="2"/><text x="1222.5" y="175" text-anchor="middle" class="node-title">Metric Agent</text><text x="1222.5" y="199" text-anchor="middle" class="body"><tspan x="1222.5" dy="0">查询指标</tspan></text><rect x="1350" y="145" width="180" height="90" rx="14" fill="#DCEBFA" stroke="#274C6B" stroke-width="2"/><text x="1440.0" y="175" text-anchor="middle" class="node-title">Log Agent</text><text x="1440.0" y="199" text-anchor="middle" class="body"><tspan x="1440.0" dy="0">查日志</tspan></text><rect x="1130" y="285" width="185" height="90" rx="14" fill="#DCEBFA" stroke="#274C6B" stroke-width="2"/><text x="1222.5" y="315" text-anchor="middle" class="node-title">Topology Agent</text><text x="1222.5" y="339" text-anchor="middle" class="body"><tspan x="1222.5" dy="0">查依赖</tspan></text><rect x="1350" y="285" width="180" height="90" rx="14" fill="#FFF0D5" stroke="#9A6700" stroke-width="2"/><text x="1440.0" y="315" text-anchor="middle" class="node-title">RCA Agent</text><text x="1440.0" y="339" text-anchor="middle" class="body"><tspan x="1440.0" dy="0">比候选</tspan></text><rect x="930" y="465" width="300" height="95" rx="14" fill="#F1F4F7" stroke="#274C6B" stroke-width="2"/><text x="1080.0" y="495" text-anchor="middle" class="node-title">Evidence Tickets</text><text x="1080.0" y="519" text-anchor="middle" class="body"><tspan x="1080.0" dy="0">来源、时间、实体、支持/反证</tspan></text><rect x="1290" y="465" width="235" height="95" rx="14" fill="#DDF3EE" stroke="#0F766E" stroke-width="2"/><text x="1407.5" y="495" text-anchor="middle" class="node-title">Verifier</text><text x="1407.5" y="519" text-anchor="middle" class="body"><tspan x="1407.5" dy="0">新查询 / 规则核对</tspan></text><rect x="1115" y="620" width="300" height="75" rx="14" fill="#F1F4F7" stroke="#274C6B" stroke-width="2"/><text x="1265.0" y="650" text-anchor="middle" class="node-title">Stop / continue / escalate</text><text x="1265.0" y="674" text-anchor="middle" class="body"><tspan x="1265.0" dy="0">满足条件才结束</tspan></text><line x1="1075" y1="225" x2="1130" y2="190" stroke="#55748D" stroke-width="2.5" marker-end="url(#arrow)"/><line x1="1075" y1="230" x2="1350" y2="190" stroke="#55748D" stroke-width="2.5" marker-end="url(#arrow)"/><line x1="1075" y1="235" x2="1130" y2="330" stroke="#55748D" stroke-width="2.5" marker-end="url(#arrow)"/><polyline points="1215,235 1215,430 1080,465" fill="none" stroke="#55748D" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><polyline points="1440,235 1440,430 1150,465" fill="none" stroke="#55748D" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><polyline points="1220,330 1220,430 1150,465" fill="none" stroke="#55748D" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="1315" y1="330" x2="1315" y2="465" stroke="#55748D" stroke-width="2.5" marker-end="url(#arrow)"/><line x1="1230" y1="510" x2="1290" y2="510" stroke="#55748D" stroke-width="2.5" marker-end="url(#arrow)"/><polyline points="1407,560 1407,620" fill="none" stroke="#55748D" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><polyline points="1115,655 880,655 880,235 850,235" fill="none" stroke="#0F766E" stroke-width="2.0" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="7 6" marker-end="url(#arrow-teal)"/><text x="1190" y="725" text-anchor="middle" font-size="14px" fill="#52677A">并行和专门角色可能有益；共享状态、协调错误和共同偏差也必须评测</text></svg>
