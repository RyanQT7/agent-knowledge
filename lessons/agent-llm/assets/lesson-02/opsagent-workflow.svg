<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 1650 900" width="1650" height="900">
<title id="title">图 5｜NKU OpsAgent 论文中的实际流程</title>
<desc id="desc">根据 OpsAgent 论文 §3.1–3.4、Figures 1–5 与源码映射制作。它显示论文实际模块；交叉评阅不是独立验证，缓解由 on-call engineer 执行。</desc>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L10,5 L0,10 z" fill="#55748D"/>
  </marker>
  <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L10,5 L0,10 z" fill="#B42318"/>
  </marker>
  <marker id="arrow-teal" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L10,5 L0,10 z" fill="#0F766E"/>
  </marker>
  <style>
    text { font-family: "Noto Sans CJK SC", "Microsoft YaHei", "SimHei", sans-serif; fill: #183247; }
    .small { font-size: 15px; fill: #52677A; }
    .label { font-size: 16px; fill: #52677A; }
    .title { font-size: 21px; font-weight: 700; }
    .node-title { font-size: 19px; font-weight: 700; }
    .body { font-size: 16px; }
    .panel-title { font-size: 23px; font-weight: 700; }
  </style>
</defs>
<rect width="1650" height="900" rx="18" fill="#FBFCFE"/>
<text x="32" y="40" class="title">图 5｜NKU OpsAgent 论文中的实际流程</text>
<text x="32" y="67" class="small">根据 OpsAgent 论文 §3.1–3.4、Figures 1–5 与源码映射制作。它显示论文实际模块；交叉评阅不是独立验证，缓解由 on-call engineer 执行。</text>
<rect x="45" y="100" width="220" height="90" rx="14" fill="#DDF3EE" stroke="#0F766E" stroke-width="2"/><text x="155.0" y="130" text-anchor="middle" class="node-title">Incident / Query</text><text x="155.0" y="154" text-anchor="middle" class="body"><tspan x="155.0" dy="0">事件请求、时间窗</tspan></text><rect x="330" y="100" width="235" height="90" rx="14" fill="#DCEBFA" stroke="#274C6B" stroke-width="2"/><text x="447.5" y="130" text-anchor="middle" class="node-title">Intent Interpreter</text><text x="447.5" y="154" text-anchor="middle" class="body"><tspan x="447.5" dy="0">识别时间范围</tspan><tspan x="447.5" dy="21">请求 AD / FT / RCL</tspan></text><rect x="630" y="100" width="225" height="90" rx="14" fill="#DCEBFA" stroke="#274C6B" stroke-width="2"/><text x="742.5" y="130" text-anchor="middle" class="node-title">Orchestrator</text><text x="742.5" y="154" text-anchor="middle" class="body"><tspan x="742.5" dy="0">设置任务与共享黑板</tspan><tspan x="742.5" dy="21">组织固定诊断流程</tspan></text><rect x="935" y="85" width="300" height="120" rx="14" fill="#F1F4F7" stroke="#274C6B" stroke-width="2"/><text x="1085.0" y="115" text-anchor="middle" class="node-title">Data Processor + Tools</text><text x="1085.0" y="139" text-anchor="middle" class="body"><tspan x="1085.0" dy="0">取 Metrics / Logs / Traces</tspan><tspan x="1085.0" dy="21">3σ / Drain3 / latency spans</tspan><tspan x="1085.0" dy="21">压缩成共享文本证据</tspan></text><rect x="1285" y="70" width="300" height="100" rx="14" fill="#DCEBFA" stroke="#274C6B" stroke-width="2"/><text x="1435.0" y="100" text-anchor="middle" class="node-title">Anomaly Sentinel</text><text x="1435.0" y="124" text-anchor="middle" class="body"><tspan x="1435.0" dy="0">AD：异常指标 / pod</tspan></text><rect x="1285" y="195" width="300" height="100" rx="14" fill="#DCEBFA" stroke="#274C6B" stroke-width="2"/><text x="1435.0" y="225" text-anchor="middle" class="node-title">Failure Diagnoser</text><text x="1435.0" y="249" text-anchor="middle" class="body"><tspan x="1435.0" dy="0">FT：故障分类</tspan></text><rect x="1285" y="320" width="300" height="100" rx="14" fill="#DCEBFA" stroke="#274C6B" stroke-width="2"/><text x="1435.0" y="350" text-anchor="middle" class="node-title">Root Detective</text><text x="1435.0" y="374" text-anchor="middle" class="body"><tspan x="1435.0" dy="0">RCL：根因定位</tspan></text><rect x="895" y="285" width="300" height="100" rx="14" fill="#FFF0D5" stroke="#9A6700" stroke-width="2"/><text x="1045.0" y="315" text-anchor="middle" class="node-title">MessagePool + ReviewPool</text><text x="1045.0" y="339" text-anchor="middle" class="body"><tspan x="1045.0" dy="0">共享证据与评审消息</tspan><tspan x="1045.0" dy="21">peer cross-review → refine</tspan></text><rect x="895" y="445" width="300" height="88" rx="14" fill="#DDF3EE" stroke="#0F766E" stroke-width="2"/><text x="1045.0" y="475" text-anchor="middle" class="node-title">Root-cause Report</text><text x="1045.0" y="499" text-anchor="middle" class="body"><tspan x="1045.0" dy="0">AD / FT / RCL 结果与理由</tspan></text><rect x="535" y="445" width="250" height="88" rx="14" fill="#F1F4F7" stroke="#274C6B" stroke-width="2"/><text x="660.0" y="475" text-anchor="middle" class="node-title">On-call Engineer</text><text x="660.0" y="499" text-anchor="middle" class="body"><tspan x="660.0" dy="0">检查报告</tspan><tspan x="660.0" dy="21">决定并执行 mitigation</tspan></text><rect x="180" y="445" width="260" height="88" rx="14" fill="#F1F4F7" stroke="#274C6B" stroke-width="2"/><text x="310.0" y="475" text-anchor="middle" class="node-title">外部结果反馈</text><text x="310.0" y="499" text-anchor="middle" class="body"><tspan x="310.0" dy="0">OCE / 人工确认的案例</tspan></text><rect x="180" y="625" width="300" height="100" rx="14" fill="#FFF0D5" stroke="#9A6700" stroke-width="2"/><text x="330.0" y="655" text-anchor="middle" class="node-title">离线演化</text><text x="330.0" y="679" text-anchor="middle" class="body"><tspan x="330.0" dy="0">Reflection retrieval</tspan><tspan x="330.0" dy="21">PPO / 更新经验或参数</tspan></text><rect x="540" y="625" width="320" height="100" rx="14" fill="#DCEBFA" stroke="#274C6B" stroke-width="2"/><text x="700.0" y="655" text-anchor="middle" class="node-title">后续任务</text><text x="700.0" y="679" text-anchor="middle" class="body"><tspan x="700.0" dy="0">检索已验证经验</tspan><tspan x="700.0" dy="21">不代表在线自动学习</tspan></text><line x1="265" y1="145" x2="330" y2="145" stroke="#55748D" stroke-width="2.5" marker-end="url(#arrow)"/><line x1="565" y1="145" x2="630" y2="145" stroke="#55748D" stroke-width="2.5" marker-end="url(#arrow)"/><line x1="855" y1="145" x2="935" y2="145" stroke="#55748D" stroke-width="2.5" marker-end="url(#arrow)"/><polyline points="1085,205 1085,245 1110,245 1110,285" fill="none" stroke="#55748D" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><polyline points="1195,330 1240,330 1240,120 1285,120" fill="none" stroke="#55748D" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><polyline points="1195,330 1240,330 1240,245 1285,245" fill="none" stroke="#55748D" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="1435" y1="170" x2="1435" y2="195" stroke="#55748D" stroke-width="2.5" marker-end="url(#arrow)"/><line x1="1435" y1="295" x2="1435" y2="320" stroke="#55748D" stroke-width="2.5" marker-end="url(#arrow)"/><polyline points="1285,370 1230,370 1230,335 1195,335" fill="none" stroke="#55748D" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><polyline points="1285,120 1225,120 1225,330 1195,330" fill="none" stroke="#55748D" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><polyline points="1285,245 1225,245 1225,330 1195,330" fill="none" stroke="#55748D" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><polyline points="1045,385 1045,445" fill="none" stroke="#55748D" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="895" y1="489" x2="785" y2="489" stroke="#55748D" stroke-width="2.5" marker-end="url(#arrow)"/><line x1="535" y1="489" x2="440" y2="489" stroke="#55748D" stroke-width="2.5" marker-end="url(#arrow)"/><polyline points="310,533 310,625" fill="none" stroke="#55748D" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="480" y1="675" x2="540" y2="675" stroke="#55748D" stroke-width="2.5" marker-end="url(#arrow)"/><polyline points="700,625 700,580 1580,580 1580,465 1585,465" fill="none" stroke="#55748D" stroke-width="2.0" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="7 6" marker-end="url(#arrow)"/><text x="1075" y="250" text-anchor="middle" font-size="14px" fill="#52677A">共享模态证据</text><text x="1120" y="420" text-anchor="middle" font-size="14px" fill="#52677A">交叉评阅 / 修订</text><text x="463" y="470" text-anchor="middle" font-size="14px" fill="#52677A">人工执行处置</text><text x="1380" y="475" text-anchor="middle" font-size="15px" fill="#B42318">论文未展示独立 verifier</text><text x="35" y="805" text-anchor="start" font-size="15px" fill="#52677A">蓝：模块 / Agent　灰：工具或人工步骤　橙：评阅、离线更新　虚线：后续任务读取经验</text></svg>
